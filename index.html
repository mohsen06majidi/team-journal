<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>ژورنال تیم</title>
<script>try{var t=localStorage.getItem("tj-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --field:#f2f2f4;
  --text:#111113; --muted:#5c5c63; --faint:#9a9aa1;
  --line:rgba(0,0,0,.1);
  --accent:#0071e3; --accent-ink:#0071e3; --accent-soft:rgba(0,113,227,.12);
  --ok:#1f7a38; --danger:#d70015;
  --radius:20px; --radius-sm:14px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);
  --blur-bg:rgba(245,245,247,.75);
  --glow:none;
  --c1:#0071e3; --c2:#a550d6; --c3:#1f7a38;
}
/* dark = empty space: true black page, thin-framed panels floating on it */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --card:#0b0b0d; --field:#161619;
    --text:#ececf0; --muted:#9a9aa3; --faint:#5b5b64;
    --line:rgba(255,255,255,.08);
    --accent:#2f7df6; --accent-ink:#79b6ff; --accent-soft:rgba(80,150,255,.15);
    --ok:#3ddc6a; --danger:#ff5a50;
    --shadow:0 0 0 1px rgba(255,255,255,.075),inset 0 1px 0 rgba(255,255,255,.04);
    --blur-bg:rgba(0,0,0,.72);
    --glow:radial-gradient(70% 38% at 50% -8%,rgba(96,120,255,.13),transparent 70%);
    --c1:#5aa9ff; --c2:#c07cf5; --c3:#45d884;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --card:#0b0b0d; --field:#161619;
  --text:#ececf0; --muted:#9a9aa3; --faint:#5b5b64;
  --line:rgba(255,255,255,.08);
  --accent:#2f7df6; --accent-ink:#79b6ff; --accent-soft:rgba(80,150,255,.15);
  --ok:#3ddc6a; --danger:#ff5a50;
  --shadow:0 0 0 1px rgba(255,255,255,.075),inset 0 1px 0 rgba(255,255,255,.04);
  --blur-bg:rgba(0,0,0,.72);
  --glow:radial-gradient(70% 38% at 50% -8%,rgba(96,120,255,.13),transparent 70%);
  --c1:#5aa9ff; --c2:#c07cf5; --c3:#45d884;
}
:root[data-theme="light"]{color-scheme:light}
body::before{content:"";position:fixed;inset:0;background:var(--glow);pointer-events:none;z-index:-1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  font-size:15px;font-weight:500;line-height:1.75;
  padding-bottom:max(56px,env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:640px;margin:0 auto;padding:0 16px}

/* header */
.topbar{
  position:sticky;top:0;z-index:20;
  margin:0 -16px;padding:max(6px,env(safe-area-inset-top)) 16px 6px;
  background:var(--blur-bg);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  display:flex;align-items:center;justify-content:space-between;min-height:46px;
}
.topbar h1{margin:0;font-size:17px;font-weight:800}
.tb{display:flex;align-items:center;gap:8px}
.avatar-btn{padding:0;border-radius:50%}
.avatar{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:14px;line-height:1;flex:none;
  background:color-mix(in srgb,var(--mc) 16%,transparent);color:var(--mc);
}
.avatar.sm{width:26px;height:26px;font-size:12px}
.banner{
  background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--radius-sm);
  padding:9px 14px;font-size:13px;font-weight:600;line-height:1.7;margin:6px 0;
}

/* the one-day header: date + prev / calendar / next */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 4px 8px}
.dayhead .info{min-width:0}
.dayhead .wk{color:var(--muted);font-size:13px;font-weight:700;line-height:1.5}
.dayhead .dt{font-size:27px;font-weight:900;line-height:1.3;letter-spacing:-.01em}
.dayhead .yr{color:var(--muted);font-size:12px;font-weight:600;line-height:1.4}
.dayhead .tools{display:flex;gap:6px;flex:none}
.iconbtn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);box-shadow:var(--shadow);color:var(--text);transition:transform .15s,opacity .2s;
}
.iconbtn.accent{background:var(--accent);color:#fff}
.iconbtn:disabled{opacity:.3}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.sm{width:34px;height:34px}.iconbtn.sm svg{width:17px;height:17px}
.sum{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 4px 8px;min-height:22px}
.pill{background:var(--card);border-radius:999px;padding:0 10px;font-size:12px;font-weight:700;color:var(--muted);box-shadow:var(--shadow)}
.pill.today{background:var(--accent);color:#fff}
.pill.ok{color:var(--ok)}

/* cards */
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 14px;margin-bottom:8px;
}
.reveal{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal,.comment{animation:none}*{transition:none!important}}

.q-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.q-num{
  flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent-ink);font-weight:800;font-size:13px;margin-top:2px;
}
.q-head h2{margin:0;font-size:16.5px;font-weight:800;line-height:1.65}
.label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 4px 5px}
textarea{
  display:block;width:100%;min-height:110px;resize:none;overflow:hidden;
  padding:11px 14px;border:0;border-radius:var(--radius-sm);
  background:var(--field);font-size:16px;font-weight:500;line-height:1.85;
  transition:box-shadow .2s ease;
}
textarea::placeholder,input::placeholder{color:var(--faint);font-weight:500}
textarea:focus,.field:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.submit-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4px 0;min-height:44px}
.save-state{font-size:12px;font-weight:600;color:var(--muted)}
.save-state[data-s=saved]{color:var(--ok)}
.save-state[data-s=error]{color:var(--danger)}
.ccount{font-size:12px;font-weight:600;color:var(--muted);padding:4px 14px 0;min-height:20px}

.aview .who{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-weight:800;font-size:13.5px}
.aview .body{white-space:pre-wrap;word-break:break-word;font-size:15.5px;font-weight:500;line-height:1.85}
.aview.empty .body{color:var(--faint);font-size:15px}

/* compact list sections (marketing, support) */
.sec{padding:10px 12px 8px;border-radius:18px;margin-bottom:8px}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:0}
.sec-head h2{margin:0;font-size:15.5px;font-weight:800;line-height:1.6}
.sec-count{color:var(--muted);font-size:12px;font-weight:700;flex:1}
.add{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:34px;margin-top:6px;
  border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:800;transition:transform .15s;
}
.add svg{width:16px;height:16px}
.add:active{transform:scale(.98)}
.row-item{display:flex;gap:6px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.row-item:first-child{border-top:0}
.row-item .main{flex:1;min-width:0}
.row-item .nm{font-weight:800;font-size:14.5px;line-height:1.6}
.row-item .nt{color:var(--muted);font-size:13px;font-weight:500;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.row-item .acts{display:flex;gap:0;flex:none;margin-top:-3px}
.tinybtn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.tinybtn svg{width:15px;height:15px}
.tinybtn:active{background:var(--field)}
.tinybtn.danger:active{color:var(--danger)}
.sec-empty{color:var(--faint);font-size:12.5px;font-weight:600;padding:2px 0 2px}
.form{background:var(--field);border-radius:14px;padding:8px;margin:4px 0}
.form .field{display:block;width:100%;flex:none;border-radius:10px;background:var(--card);padding:7px 12px;font-size:16px;font-weight:700;margin-bottom:6px}
.form textarea{min-height:60px;padding:8px 12px;font-size:16px;line-height:1.8;border-radius:10px;background:var(--card)}
.form .bar{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.sec .comments{margin-top:4px;padding-top:6px}
.sec .comments h3{font-size:12px;margin-bottom:0}
.sec .comment{padding:3px 0}
.sec .comment .bubble{padding:4px 11px}
.sec .comment .txt{font-size:13.5px;line-height:1.7}
.sec .cform{margin-top:6px}
.sec .cform .field{padding:6px 14px;font-size:16px}
.sec .send{width:34px;height:34px}
.sec .ccount{padding-top:2px;min-height:16px}

.comments{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.comments h3{margin:0 4px 4px;font-size:12px;font-weight:700;color:var(--muted)}
.comment{display:flex;gap:8px;padding:5px 0;animation:rise .4s both}
.comment .bubble{background:var(--field);border-radius:16px;padding:5px 12px;flex:1;min-width:0}
.comment .meta{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.comment .meta b{color:var(--text);font-weight:800;font-size:12px}
.comment .txt{white-space:pre-wrap;word-break:break-word;font-size:14px;font-weight:500;line-height:1.75}
.comment .del{margin-inline-start:auto;font-size:12px;font-weight:600;color:var(--muted);padding:2px 4px}
.cform{display:flex;gap:6px;margin-top:6px}
.field{
  flex:1;min-width:0;border:0;background:var(--field);border-radius:999px;
  padding:8px 15px;font-size:16px;font-weight:500;transition:box-shadow .2s;
}
.send{
  flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;transition:transform .15s,opacity .2s;
}
.send:disabled{opacity:.35}
.send svg{width:17px;height:17px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  background:var(--accent);color:#fff;border-radius:999px;padding:9px 20px;font-weight:800;font-size:14.5px;
  transition:transform .15s,opacity .2s;min-height:42px;
}
.btn.sm{min-height:36px;padding:6px 20px;font-size:14px}
.btn.xs{min-height:32px;padding:3px 16px;font-size:13px}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.sheet .btn.ghost,.form .btn.ghost{background:var(--field);box-shadow:none}
.form .btn.ghost{background:var(--card)}
.btn.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.btn:active,.send:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.today-link{margin-top:4px}
.lnk{font-weight:800;text-decoration:underline;color:inherit;padding:0 4px}
.chips{display:flex;gap:6px;margin:8px 0 4px}
.chip{padding:3px 14px;border-radius:999px;background:var(--field);font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--accent);color:#fff}
.s-info{color:var(--muted);font-size:12.5px;font-weight:600;margin:6px 4px}
.sg{display:flex;justify-content:space-between;align-items:baseline;margin:12px 4px 4px;font-weight:800;font-size:14.5px}
.sg small{color:var(--muted);font-weight:700;font-size:12px}
.sr{display:block;width:100%;text-align:start;background:var(--field);border-radius:12px;padding:6px 12px;margin:3px 0}
.sr .d{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:800}
.sr .tag{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:0 8px}
.sr .tag.sp{color:var(--c2);background:color-mix(in srgb,var(--c2) 14%,transparent)}
.sr .n{color:var(--muted);font-size:12.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.sheet.tall{height:88dvh}
.dv{padding:8px 0;border-top:1px solid var(--line)}
.dv:first-of-type{border-top:0}
.dv .t{display:flex;gap:8px;align-items:center;font-weight:800;font-size:14px}
.dv .st{font-size:11px;font-weight:700;border-radius:99px;padding:0 8px;background:var(--field);color:var(--muted)}
.dv .st.ok{color:var(--ok)}
.dv .st.wait{color:var(--danger)}
.dv .m{color:var(--muted);font-size:12px;font-weight:600}
.dv .bar{display:flex;gap:6px;margin-top:6px}
.dvh{margin:12px 4px 0;font-weight:800;font-size:14px}

/* login */
.center{min-height:100dvh;display:grid;place-items:center;padding:24px 0}
.login{width:100%}
.login h1{font-size:32px;margin:0 0 6px;font-weight:900}
.login p{margin:0 0 24px;color:var(--muted);font-weight:600}
.login .hint{margin:14px 4px 0;font-size:12.5px;color:var(--faint)}
.login .field{display:block;width:100%;border-radius:var(--radius-sm);margin-bottom:12px;padding:14px 18px}
.ltr{direction:ltr;text-align:left}
.err{color:var(--danger);font-size:14px;font-weight:600;min-height:24px;margin:4px 4px 8px}

/* sheets (settings, calendar) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .3s;z-index:40}
.sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:50;max-width:640px;margin:0 auto;
  background:var(--card);border-radius:28px 28px 0 0;padding:12px 20px max(24px,env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
  max-height:90dvh;overflow:auto;
}
.sheet.open{transform:none}.overlay.open{opacity:1}
.grab{width:40px;height:5px;border-radius:99px;background:var(--faint);opacity:.5;margin:0 auto 16px}
.sheet h3{margin:0 0 2px;font-size:18px;font-weight:800}
.sheet .sub{color:var(--muted);font-size:13px;font-weight:600;margin-bottom:10px}
.sheet .row{display:flex;gap:8px;margin:7px 0;flex-wrap:wrap}
.sheet .field{border-radius:var(--radius-sm);width:100%;flex:none;display:block}
.pick{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;border-radius:999px;background:var(--field);font-weight:700}
.pick small{color:var(--muted);font-weight:600}
.pick.on{box-shadow:0 0 0 2px var(--accent)}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.cal-title{font-size:20px;font-weight:800}
.sheet .iconbtn{background:var(--field);box-shadow:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px}
.cal-wd{text-align:center;color:var(--muted);font-size:13px;font-weight:700;padding:4px 0}
.cal-day{
  position:relative;display:grid;place-items:center;width:100%;max-width:46px;height:44px;margin:0 auto;
  border-radius:22px;font-size:16px;font-weight:700;color:var(--text);
}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day.sel{background:var(--accent);color:#fff}
.cal-day:disabled{color:var(--faint);opacity:.45}
.cal-day .dot{position:absolute;bottom:4px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal-day.sel .dot{background:#fff}
.cal-foot{display:flex;gap:10px;margin-top:14px}
.cal-foot .btn{flex:1}

.toast{
  position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--text);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .3s;z-index:60;white-space:nowrap
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{display:grid;place-items:center;min-height:50dvh;color:var(--muted)}
.dots span{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--faint);animation:pulse 1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

.sheet{border-top:1px solid var(--line)}
.bell{position:relative}
.badge{position:absolute;top:-5px;left:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;line-height:17px;text-align:center;box-shadow:0 0 0 2px var(--bg)}
.comments{padding-top:3px;margin-top:8px}
.sec .comments{padding-top:2px;margin-top:4px}
.ctoggle{display:flex;align-items:center;gap:6px;width:100%;padding:4px 2px;color:var(--muted);font-size:12.5px;font-weight:700}
.ctoggle svg{width:15px;height:15px;flex:none}
.ctoggle .ch{flex:1;text-align:start}
.ctoggle .cv{display:grid;transition:transform .2s}
.comments.open .cv{transform:rotate(180deg)}
.cbody{padding-top:2px}
.nf{display:block;width:100%;text-align:start;padding:8px 12px;border-radius:14px;background:var(--field);margin:5px 0}
.nf .top{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800}
.nf .top small{color:var(--muted);font-weight:600;margin-inline-start:auto;font-size:11.5px}
.nf .nd{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.nf .nd.off{background:transparent}
.nf .wh{color:var(--muted);font-size:11.5px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nf .tx{font-size:14px;line-height:1.7;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.seg{display:flex;background:var(--field);border-radius:12px;padding:3px;gap:2px;margin:4px 0 10px}
.seg button{flex:1;padding:5px 0;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--bg)}

body{padding-bottom:max(92px,calc(78px + env(safe-area-inset-bottom)))}
.toast{bottom:max(96px,calc(84px + env(safe-area-inset-bottom)))}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 14px max(10px,env(safe-area-inset-bottom));pointer-events:none}
.tabbar .in{pointer-events:auto;display:flex;gap:4px;width:100%;max-width:400px;padding:5px;border-radius:24px;background:var(--blur-bg);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:var(--shadow),0 8px 28px rgba(0,0,0,.14)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:19px;color:var(--muted);font-size:11.5px;font-weight:700;text-decoration:none;transition:background .2s,color .2s}
.tab svg{width:21px;height:21px}
.tab.on{background:var(--accent-soft);color:var(--accent-ink)}
.whobar{display:flex;align-items:center;gap:10px;margin:6px 4px 0}
.whobar b{display:block;font-size:14.5px;line-height:1.4}
.whobar small{color:var(--muted);font-size:12px;font-weight:600}

/* Persian (Jalali) calendar maths, done with the browser's own calendar so it is always right. */
const PNUM = new Intl.DateTimeFormat("fa-IR-u-ca-persian-nu-latn",{year:"numeric",month:"numeric",day:"numeric"});
function jparts(d){
  const o = {};
  for (const p of PNUM.formatToParts(d)) if (p.type === "year" || p.type === "month" || p.type === "day") o[p.type] = parseInt(p.value,10);
  return {y:o.year, m:o.month, d:o.day};
}
function jmFirst(jy,jm){                 // Gregorian Date (noon) of the 1st day of Jalali month jm of year jy
  const target = jy*12 + jm;
  const g = new Date(jy+621, 2, 21, 12);
  g.setDate(g.getDate() + Math.round((jm-1)*30.44));
  for (let i = 0; i < 90; i++){
    const p = jparts(g), cur = p.y*12 + p.m;
    if (cur > target) g.setDate(g.getDate() - p.d);          // jump back to the last day of the previous month
    else if (cur < target) g.setDate(g.getDate() + 1);
    else if (p.d > 1) g.setDate(g.getDate() - (p.d - 1));
    else return g;
  }
  return g;
}
function jmLen(jy,jm){
  const g = jmFirst(jy,jm); let n = 0;
  while (jparts(g).m === jm && n < 32){ n++; g.setDate(g.getDate()+1); }
  return n;
}

function createDemoApi(){
  const KEY = "team-journal-demo-v5";
  const stamp = (date,h,m=0) => { const d = parseISO(date); d.setHours(h,m,0,0); return d.toISOString(); };
  const MEMBERS0 = [
    {id:"u1",name:"سید محسن مجیدی",role:"admin",active:true,email:"admin@demo"},
    {id:"u2",name:"سید جواد مجیدی",role:"member",active:true,email:"javad@demo"},
    {id:"u3",name:"دکتر امیری",role:"member",active:true,email:"amiri@demo"}
  ];
  function seed(){
    const t = todayISO(), answers = [], comments = [], items = [], dates = new Set([t]);
    let cid = 1;
    Object.entries(PLANS).forEach(([uid,plan],ui) => {
      for (const [off,[q,mk,sp]] of Object.entries(plan)){
        const date = addDays(t,-Number(off)), o = Number(off) + ui*3; dates.add(date);
        if (q) answers.push({date,q:1,user_id:uid,body:POOL_Q[o % POOL_Q.length],updated_at:stamp(date,10+ui)});
        for (let k=0;k<mk;k++){ const [n,x] = POOL_MK[(o+k*2) % POOL_MK.length]; items.push({id:`m-${uid}-${off}-${k}`,date,kind:"marketing",user_id:uid,name:n,notes:x,created_at:stamp(date,12+k)}); }
        for (let k=0;k<sp;k++){ const [n,x] = POOL_SP[(o+k*2) % POOL_SP.length]; items.push({id:`s-${uid}-${off}-${k}`,date,kind:"support",user_id:uid,name:n,notes:x,created_at:stamp(date,15+k)}); }
      }
    });
    for (const c of SEED_COMMENTS){
      const date = addDays(t,-c.off);
      comments.push({id:"c"+(cid++),date,q:c.t,user_id:MEMBERS0[c.j].id,report_user:MEMBERS0[c.r].id,body:c.txt,created_at:stamp(date,c.h,20)});
    }
    return {meId:"u1",members:MEMBERS0.map(m => ({...m})),answers,comments,items,dates:[...dates]};
  }
  let db = null;
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!db || !Array.isArray(db.answers) || !Array.isArray(db.members)) db = seed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
  save();
  const me = () => db.members.find(m => m.id === db.meId);
  const admin = () => { if (me().role !== "admin") throw new Error("admin only"); };
  const ensureDay = date => { if (!db.dates.includes(date)) db.dates.push(date); };
  const byTime = (a,b) => a.created_at.localeCompare(b.created_at);
  const adminsLeft = except => db.members.some(m => m.role === "admin" && m.active && m.id !== except);
  return {
    mode:"demo", needsUpdate:false,
    async getSession(){ return {id:me().id,email:me().email}; },
    async members(){ return db.members.map(m => ({...m})); },
    switchUser(id){ db.meId = id; save(); },
    async listDays(owner){
      const ds = new Set([...db.answers.filter(a => a.user_id === owner), ...db.items.filter(x => x.user_id === owner)].map(x => x.date));
      return [...ds].sort().reverse().map(date => ({date}));
    },
    async loadEntry(date, owner){
      return {
        exists: db.dates.includes(date),
        answers: db.answers.filter(a => a.date===date && a.user_id===owner).map(a => ({...a})),
        comments: db.comments.filter(c => c.date===date && c.report_user===owner).map(c => ({...c})).sort(byTime),
        items: db.items.filter(x => x.date===date && x.user_id===owner).map(x => ({...x})).sort(byTime),
        questions: null
      };
    },
    async saveAnswer(date,q,body){
      await sleep(250); ensureDay(date);
      const i = db.answers.findIndex(a => a.date===date && a.q===q && a.user_id===db.meId);
      if (!body.trim()){ if (i>=0) db.answers.splice(i,1); }
      else if (i>=0){ db.answers[i].body = body; db.answers[i].updated_at = new Date().toISOString(); }
      else db.answers.push({date,q,user_id:db.meId,body,updated_at:new Date().toISOString()});
      save();
    },
    async deleteAnswerOf(date,q,owner){ admin(); db.answers = db.answers.filter(a => !(a.date===date && a.q===q && a.user_id===owner)); save(); },
    async addComment(date,q,body,reportUser){
      await sleep(150);
      const c = {id:"c"+Date.now(),date,q,user_id:db.meId,report_user:reportUser,body,created_at:new Date().toISOString()};
      db.comments.push(c); save(); return {...c};
    },
    async editComment(id,body){
      const c = db.comments.find(x => x.id===id); if (!c || c.user_id !== db.meId) throw new Error("not yours");
      c.body = body; save();
    },
    async deleteComment(id){
      const c = db.comments.find(x => x.id===id); if (!c) return;
      if (c.user_id !== db.meId && me().role !== "admin") throw new Error("not allowed");
      db.comments = db.comments.filter(x => x.id!==id); save();
    },
    async saveItem(date,{id,kind,name,notes}){
      await sleep(200);
      if (id){
        const it = db.items.find(x => x.id===id); if (!it || it.user_id !== db.meId) throw new Error("not yours");
        it.name = name; it.notes = notes; save(); return {...it};
      }
      ensureDay(date);
      const it = {id:"i"+Date.now()+Math.random().toString(36).slice(2,6),date,kind,user_id:db.meId,name,notes,created_at:new Date().toISOString()};
      db.items.push(it); save(); return {...it};
    },
    async deleteItem(id){
      const it = db.items.find(x => x.id===id); if (!it) return;
      if (it.user_id !== db.meId && me().role !== "admin") throw new Error("not allowed");
      db.items = db.items.filter(x => x.id!==id); save();
    },
    async searchItems(owner){ return db.items.filter(x => x.user_id === owner).map(x => ({...x})); },
    async listFeedback(){ return db.comments.map(c => ({id:c.id,date:c.date,q:c.q,user_id:c.user_id,report_user:c.report_user,body:c.body,created_at:c.created_at})); },
    async exportAll(){
      return {members:db.members.map(m => ({id:m.id,name:m.name,role:m.role})), entries:db.dates.map(date => ({date})),
        answers:db.answers.map(a => ({...a})), comments:db.comments.map(c => ({...c})), items:db.items.map(x => ({...x}))};
    },
    /* member management (admin) */
    async listMembersAdmin(){ admin(); return db.members.map(m => ({user_id:m.id,email:m.email,display_name:m.name,role:m.role,active:m.active})); },
    async addMember(email,name,role){
      admin(); if (db.members.some(m => m.email.toLowerCase() === email.toLowerCase())) throw new Error("already a member");
      db.members.push({id:"u"+Date.now(),name,role,active:true,email}); save();
    },
    async setRole(id,role){ admin(); if (role==="member" && !adminsLeft(id)) throw new Error("there must stay at least one active admin"); db.members.find(m => m.id===id).role = role; save(); },
    async setActive(id,on){ admin(); if (!on && id===db.meId) throw new Error("you cannot switch yourself off"); db.members.find(m => m.id===id).active = on; save(); },
    async renameMember(id,name){ admin(); db.members.find(m => m.id===id).name = name; save(); },
    async removeMember(id){ admin(); if (id===db.meId) throw new Error("you cannot remove yourself"); db.members = db.members.filter(m => m.id!==id); save(); },
    async signOut(){}, async updatePassword(){}
  };
}

/* =====================================================================
   LIVE API  (Supabase: auth + Postgres with Row Level Security)
   ===================================================================== */
async function createLiveApi(){
  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");

  /* The login is kept ONLY for this tab (sessionStorage): opening the link again in a new tab or
     after closing the browser always shows the login page. */
  const mem = {};
  const store = {
    getItem:k => { try { return sessionStorage.getItem(k); } catch { return k in mem ? mem[k] : null; } },
    setItem:(k,v) => { try { sessionStorage.setItem(k,v); } catch { mem[k] = v; } },
    removeItem:k => { try { sessionStorage.removeItem(k); } catch { delete mem[k]; } }
  };
  /* remove a login that an older version of this page saved permanently on this device */
  try { Object.keys(localStorage).filter(k => /^sb-.*-auth-token/.test(k)).forEach(k => localStorage.removeItem(k)); } catch {}

  const sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:store}
  });
  let teamId = null, uid = null, needsUpdate = false;
  async function pageAll(build){
    let out = [], from = 0;
    for (;;){
      const r = await build().range(from, from + 999);
      if (r.error) throw r.error;
      out = out.concat(r.data);
      if (r.data.length < 1000) return out;
      from += 1000;
    }
  }
  async function pageItems(){
    try { return await pageAll(() => sb.from("marketing_items").select("id,entry_id,user_id,kind,doctor_name,notes,created_at").order("id")); }
    catch (e) {
      if (!/kind/i.test((e && e.message) || "")) throw e;
      return await pageAll(() => sb.from("marketing_items").select("id,entry_id,user_id,doctor_name,notes,created_at").order("id"));
    }
  }
  const must = ({data,error}) => { if (error) throw error; return data; };

  async function entryRow(date, create){
    let row = must(await sb.from("entries").select("id,questions").eq("entry_date",date).maybeSingle());
    if (!row && create){
      must(await sb.from("entries").upsert({team_id:teamId,entry_date:date,questions:QUESTIONS},{onConflict:"team_id,entry_date",ignoreDuplicates:true}));
      row = must(await sb.from("entries").select("id,questions").eq("entry_date",date).maybeSingle());
    }
    return row;
  }
  const upd6 = e => { if (e && /report_user|active|admin_/i.test(e.message || "")) throw new Error("update 6 needed"); throw e; };
  return {
    mode:"live",
    get needsUpdate(){ return needsUpdate; },
    async listFeedback(){
      const [ents, com] = await Promise.all([
        pageAll(() => sb.from("entries").select("id,entry_date").order("id")),
        pageAll(() => sb.from("comments").select("id,entry_id,question_no,user_id,report_user,body,created_at").order("id"))]).catch(upd6);
      const dm = new Map(ents.map(e => [e.id, e.entry_date]));
      return com.filter(c => dm.has(c.entry_id)).map(c => ({id:c.id,date:dm.get(c.entry_id),q:c.question_no,user_id:c.user_id,report_user:c.report_user,body:c.body,created_at:c.created_at}));
    },
    async searchItems(owner){
      const [ents, its] = await Promise.all([
        pageAll(() => sb.from("entries").select("id,entry_date").order("id")), pageItems()]);
      const dm = new Map(ents.map(e => [e.id, e.entry_date]));
      return its.filter(r => r.user_id === owner && dm.has(r.entry_id)).map(r => ({id:r.id,date:dm.get(r.entry_id),kind:r.kind || "marketing",name:r.doctor_name,notes:r.notes,created_at:r.created_at}));
    },
    async exportAll(){
      const [mem, ents, ans, com, its] = await Promise.all([
        sb.from("members").select("user_id,display_name,role"),
        pageAll(() => sb.from("entries").select("id,entry_date").order("id")),
        pageAll(() => sb.from("answers").select("entry_id,question_no,user_id,body,updated_at").order("id")),
        pageAll(() => sb.from("comments").select("entry_id,question_no,user_id,report_user,body,created_at").order("id")),
        pageItems()]).catch(upd6);
      const dm = new Map(ents.map(e => [e.id, e.entry_date]));
      return {
        members:must(mem).map(m => ({id:m.user_id,name:m.display_name,role:m.role})),
        entries:ents.map(e => ({date:e.entry_date})),
        answers:ans.map(r => ({date:dm.get(r.entry_id),q:r.question_no,user_id:r.user_id,body:r.body,updated_at:r.updated_at})),
        comments:com.map(r => ({date:dm.get(r.entry_id),q:r.question_no,user_id:r.user_id,report_user:r.report_user,body:r.body,created_at:r.created_at})),
        items:its.map(r => ({date:dm.get(r.entry_id),kind:r.kind || "marketing",user_id:r.user_id,name:r.doctor_name,notes:r.notes,created_at:r.created_at}))
      };
    },
    async getSession(){
      const { data } = await sb.auth.getSession();
      const u = data.session?.user; if (!u) return null;
      uid = u.id; return {id:u.id,email:u.email};
    },
    async signIn(email,password){
      const { data, error } = await sb.auth.signInWithPassword({email,password});
      if (error) throw error;
      uid = data.user.id; return {id:data.user.id,email:data.user.email};
    },
    async signOut(){ await sb.auth.signOut(); },
    async updatePassword(password){ const { error } = await sb.auth.updateUser({password}); if (error) throw error; },
    async members(){
      const rows = must(await sb.from("members").select("user_id,team_id,display_name,role,active").order("created_at"));
      const mine = rows.find(r => r.user_id === uid);
      if (mine) teamId = mine.team_id;
      return rows.map(r => ({id:r.user_id,name:r.display_name,role:r.role,active:r.active !== false}));
    },
    /* dates on which this member wrote something (for the calendar dots) */
    async listDays(owner){
      const [ents, ans, its] = await Promise.all([
        pageAll(() => sb.from("entries").select("id,entry_date").order("id")),
        pageAll(() => sb.from("answers").select("entry_id").eq("user_id",owner).order("id")),
        pageAll(() => sb.from("marketing_items").select("entry_id").eq("user_id",owner).order("id"))]);
      const dm = new Map(ents.map(e => [e.id, e.entry_date])), set = new Set();
      ans.concat(its).forEach(r => { const d = dm.get(r.entry_id); if (d) set.add(d); });
      return [...set].sort().reverse().map(date => ({date}));
    },
    async loadEntry(date, owner){
      const row = await entryRow(date,false);
      if (!row) return {exists:false,answers:[],comments:[],items:[],questions:null};
      const id = row.id;
      const [a,c] = await Promise.all([
        sb.from("answers").select("question_no,user_id,body,updated_at").eq("entry_id",id).eq("user_id",owner),
        sb.from("comments").select("id,question_no,user_id,report_user,body,created_at").eq("entry_id",id).eq("report_user",owner).order("created_at")
      ]);
      if (c.error) upd6(c.error);
      let it = await sb.from("marketing_items").select("id,user_id,kind,doctor_name,notes,created_at").eq("entry_id",id).eq("user_id",owner).order("created_at");
      if (it.error && /kind/i.test(it.error.message || "")){          // database not updated yet: only the old list exists
        it = await sb.from("marketing_items").select("id,user_id,doctor_name,notes,created_at").eq("entry_id",id).eq("user_id",owner).order("created_at");
      }
      needsUpdate = Boolean(it.error) || (it.data || []).some(r => r.kind === undefined);
      const items = it.error ? [] : it.data.map(r => ({id:r.id,date,kind:r.kind || "marketing",user_id:r.user_id,name:r.doctor_name,notes:r.notes,created_at:r.created_at}));
      return {
        exists:true, items,
        answers: must(a).map(r => ({date,q:r.question_no,user_id:r.user_id,body:r.body,updated_at:r.updated_at})),
        comments: c.data.map(r => ({id:r.id,date,q:r.question_no,user_id:r.user_id,report_user:r.report_user,body:r.body,created_at:r.created_at})),
        questions: normQs(row.questions)
      };
    },
    async saveAnswer(date,q,body){
      const row = await entryRow(date, true);
      if (!row) throw new Error("no entry");
      const id = row.id;
      if (!body.trim()){
        must(await sb.from("answers").delete().eq("entry_id",id).eq("question_no",q).eq("user_id",uid));
        return;
      }
      must(await sb.from("answers").upsert(
        {team_id:teamId,entry_id:id,question_no:q,user_id:uid,body},
        {onConflict:"entry_id,question_no,user_id"}));
    },
    async deleteAnswerOf(date,q,owner){          // admin removes a colleague's written answer
      const row = await entryRow(date, false); if (!row) return;
      must(await sb.from("answers").delete().eq("entry_id",row.id).eq("question_no",q).eq("user_id",owner));
    },
    async addComment(date,q,body,reportUser){
      const row = await entryRow(date, false);
      if (!row) throw new Error("no entry");
      const r = must(await sb.from("comments").insert({team_id:teamId,entry_id:row.id,question_no:q,user_id:uid,report_user:reportUser,body})
        .select("id,created_at").single());
      return {id:r.id,date,q,user_id:uid,report_user:reportUser,body,created_at:r.created_at};
    },
    async editComment(id,body){ must(await sb.from("comments").update({body}).eq("id",id).select("id").single()); },
    async deleteComment(id){ must(await sb.from("comments").delete().eq("id",id)); },
    async saveItem(date,{id,kind,name,notes}){
      if (needsUpdate) throw new Error("update needed");
      const cols = "id,user_id,kind,doctor_name,notes,created_at";
      let r;
      if (id){
        r = must(await sb.from("marketing_items").update({doctor_name:name,notes}).eq("id",id).select(cols).single());
      } else {
        const row = await entryRow(date, true);
        if (!row) throw new Error("no entry");
        r = must(await sb.from("marketing_items").insert({team_id:teamId,entry_id:row.id,user_id:uid,kind,doctor_name:name,notes}).select(cols).single());
      }
      return {id:r.id,date,kind:r.kind,user_id:r.user_id,name:r.doctor_name,notes:r.notes,created_at:r.created_at};
    },
    async deleteItem(id){ must(await sb.from("marketing_items").delete().eq("id",id)); },
    /* member management: only works for the admin (the database refuses everybody else) */
    async listMembersAdmin(){ const { data, error } = await sb.rpc("admin_list_members"); if (error) throw error; return data || []; },
    async addMember(email,name,role){ const { error } = await sb.rpc("admin_add_member", {p_email:email,p_name:name,p_role:role}); if (error) throw error; },
    async setRole(id,role){ const { error } = await sb.rpc("admin_set_role", {p_user:id,p_role:role}); if (error) throw error; },
    async setActive(id,on){ const { error } = await sb.rpc("admin_set_active", {p_user:id,p_active:on}); if (error) throw error; },
    async renameMember(id,name){ const { error } = await sb.rpc("admin_rename_member", {p_user:id,p_name:name}); if (error) throw error; },
    async removeMember(id){ const { error } = await sb.rpc("admin_remove_member", {p_user:id}); if (error) throw error; }
  };
}

/* ---- routing:  #/  (my today)   #/d/DATE (my day)   #/c (colleagues)   #/c/ID[/DATE] (a colleague's day) ---- */
function hashFor(uid, date){
  const today = date === todayISO();
  return uid === state.me.id ? (today ? "#/" : "#/d/" + date) : "#/c/" + encodeURIComponent(uid) + (today ? "" : "/" + date);
}
function parseRoute(){
  const h = location.hash, today = todayISO();
  const clampd = d => (d && validISO(d) && d <= today) ? d : today;
  let m = h.match(/^#\/c\/([^/]+)(?:\/(\d{4}-\d{2}-\d{2}))?$/);
  if (m) return {page:"colleague", uid:decodeURIComponent(m[1]), date:clampd(m[2])};
  if (/^#\/c\/?$/.test(h)) return {page:"colleagues"};
  m = h.match(/^#\/d\/(\d{4}-\d{2}-\d{2})$/);
  return {page:"home", uid:state.me.id, date:clampd(m && m[1])};
}
function goTo(uid, date){
  const h = hashFor(uid, date);
  if (location.hash === h || (h === "#/" && !location.hash)) showRoute(); else location.hash = h;
}
const go = date => goTo(state.view.id, date);
const setTab = p => document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.p === p));
function showRoute(){
  if (!state.me) return;
  const r = parseRoute();
  clearInterval(pollTimer);
  if (r.page === "colleagues"){ setTab("col"); return showColleagues(); }
  const v = r.page === "home" ? state.me : memberOf(r.uid);
  if (!v || !v.active){ location.hash = "#/c"; return; }
  if (r.page === "colleague" && v.id === state.me.id){ location.hash = "#/"; return; }
  state.view = v; state.isOwner = v.id === state.me.id;
  setTab(state.isOwner ? "home" : "col");
  showDay(r.date);
}
addEventListener("hashchange", showRoute);

  const others = state.members.filter(m => m.id !== state.me.id && m.active), last = {};
  await Promise.all(others.map(async m => { try { const d = await api.listDays(m.id); last[m.id] = {n:d.length, date:d[0] && d[0].date}; } catch {} }));
  if (state.page !== "colleagues") return;
  view.innerHTML = `<div class="pagehead reveal"><h2>گزارش همکاران</h2><div class="sub2">گزارش روزانه‌ی همکارانت را بخوان و زیرش فیدبک کوتاه بنویس.</div></div>` +
    (others.map((m,i) => { const l = last[m.id];
      return `<a class="colleague card reveal" style="--i:${i+1}" href="#/c/${encodeURIComponent(m.id)}">${avatar(m)}
        <div class="cn"><b>${esc(m.name)}</b><small>${l && l.date ? `آخرین گزارش: ${esc(dayMonth(l.date))} · ${fa(l.n)} روز` : "هنوز گزارشی ننوشته"}</small></div>
        <span class="go">${svgNext}</span></a>`; }).join("") || `<div class="card"><div class="sec-empty">هنوز همکاری در تیم نیست.</div></div>`);
  window.scrollTo(0,0);
}

/* ---- which questions to show for this day ---- */
function visibleQuestions(){
  const e = state.entry, base = e.questions || QUESTIONS, cur = new Set(QUESTIONS.map(q => q.id));
  const answered = new Set((e.answers || []).filter(a => state.view && a.user_id === state.view.id && a.body.trim()).map(a => a.q));
  const title = id => (base.find(q => q.id === id) || QUESTIONS.find(q => q.id === id) || {}).title || LEGACY_TITLES[id] || "سؤال قبلی";
  const ids = new Set();
  base.forEach(q => { if (cur.has(q.id) || answered.has(q.id)) ids.add(q.id); });
  answered.forEach(id => ids.add(id));
  return [...ids].sort((a,b) => a-b).map(id => ({id,title:title(id)}));
}

/* ---- the day page ---- */
async function showDay(date){
  clearInterval(pollTimer);
  const view = $("#view"); if (!view) return;
  state.date = date; state.page = "day"; drafts = {}; state.openT = new Set();
  const owner = state.view;
  view.innerHTML = loadingHTML();
  refreshDates();
  let entry;
  try { entry = await api.loadEntry(date, owner.id); }
  catch (e) {
    console.error(e);
    if (state.date === date){
      const old = e && /update 6/.test(e.message || "");
      view.innerHTML = `<div class="card"><p style="margin:0 0 14px">${old ? "دیتابیس هنوز به‌روز نشده است. فایل supabase-update-6.sql را در Supabase اجرا کن." : "اطلاعات بارگذاری نشد. اتصال اینترنت را بررسی کن."}</p><button class="btn block" id="retry">تلاش دوباره</button></div>`;
      $("#retry").onclick = () => showDay(date);
    }
    return;
  }
  if (state.date !== date || state.view !== owner) return;
  state.entry = entry;
  renderNotice();
  const qs = visibleQuestions();
  state.qIds = qs.map(q => q.id);
  view.innerHTML = dayHTML(date, qs);
  $("#prev").onclick = () => go(addDays(date,-1));
  $("#next").onclick = () => go(addDays(date,1));
  $("#cal").onclick = openCalendar;
  const gt = $("#gotoToday"); if (gt) gt.onclick = () => go(todayISO());
  qs.forEach(q => {
    if (state.isOwner) bindAuthorCard(q.id, date); else renderAnswerView(q.id);
  });
  SECTIONS.forEach(sec => bindSection(sec, date));
  state.qIds.concat(SECTIONS.map(s => s.thread)).forEach(t => { renderComments(t); bindComments(t, date); });
  updateSummary();
  window.scrollTo(0,0);
  if (state.focusT !== null){
    const t = state.focusT; state.focusT = null;
    if (cardEl(t)){ state.openT.add(t); renderComments(t); cardEl(t).scrollIntoView({block:"center"}); }
  }
  pollTimer = setInterval(() => { if (!document.hidden) refreshCurrent(); }, 30000);
}

function updateSummary(){

/* ---- written answers ---- */
function renderAnswerView(q){
  const box = $(".aview", cardEl(q)), a = answerOf(q), au = state.view;
  box.className = "aview" + (a ? "" : " empty");
  box.innerHTML = (a && au ? `<div class="who">${avatar(au,"sm")}<span>${esc(au.name)}</span></div>` : "") +

    (a && state.isAdmin && !state.isOwner ? `<button class="linkdel ans-del" type="button">حذف این پاسخ (مدیر)</button>` : "");

function autoGrow(ta, min = 110){ ta.style.height = "auto"; ta.style.height = Math.max(min, ta.scrollHeight) + "px"; }

/* Nothing is visible to the others until the author presses «ثبت جواب». The draft stays on this phone. */
function bindAuthorCard(q, date){
  const card = cardEl(q), ta = $("textarea", card), st = $(".save-state", card), btn = $(".submit", card);
  const key = `tj-draft:${state.me.id}:${date}:${q}`;
  const setSt = (s,t) => { st.dataset.s = s; st.textContent = t; };
  const submitted = () => { const a = answerOf(q); return a ? a.body : null; };
  function refresh(){
    const sub = submitted(), v = ta.value, has = v.trim().length > 0;
    if (sub === null){
      btn.textContent = "ثبت جواب"; btn.disabled = !has;
      setSt("draft", has ? "ثبت نشده — هنوز کسی نمی‌بیند" : "");
    } else if (v === sub){
      btn.textContent = "ثبت شده ✓"; btn.disabled = true;
      setSt("saved","ثبت شد — دیگران می‌بینند");
    } else if (!has){
      btn.textContent = "حذف پاسخ"; btn.disabled = false;
      setSt("draft","با زدن دکمه، پاسخ ثبت‌شده حذف می‌شود");
    } else {
      btn.textContent = "ثبت تغییرات"; btn.disabled = false;
      setSt("draft","تغییرات هنوز ثبت نشده");
    }
  }
  const sub0 = submitted(), draft0 = lsGet(key);
  ta.value = draft0 !== null ? draft0 : (sub0 !== null ? sub0 : "");
  autoGrow(ta); refresh();
  ta.addEventListener("input", () => {
    autoGrow(ta);
    const sub = submitted();
    lsSet(key, ta.value === (sub === null ? "" : sub) ? null : ta.value);
    refresh();
  });
  btn.onclick = async () => {
    const v = ta.value;
    btn.disabled = true; btn.textContent = "در حال ثبت…";
    try {
      await api.saveAnswer(date,q,v);
      const e = state.entry;
      e.answers = e.answers.filter(a => !(a.q===q && a.user_id===state.me.id));
      if (v.trim()) e.answers.push({date,q,user_id:state.me.id,body:v,updated_at:new Date().toISOString()});
      else ta.value = "";
      lsSet(key,null); state.dates.add(date);
      renderComments(q); updateSummary(); autoGrow(ta); refresh();
      toast(v.trim() ? "جواب ثبت شد" : "جواب حذف شد");
    } catch { toast("ثبت نشد. اتصال را بررسی کن."); refresh(); }
  };
}

/* ---- compact lists: marketing, support ---- */
const draftKey = sec => `tj-mk:${state.me.id}:${state.date}:${sec.kind}`;
function secDrafts(sec){
  if (!drafts[sec.kind]){
    let saved = []; try { saved = JSON.parse(lsGet(draftKey(sec)) || "[]"); } catch {}
    drafts[sec.kind] = (Array.isArray(saved) ? saved : []).filter(x => x && typeof x === "object")
      .map(x => ({k:++seq,name:String(x.name || ""),notes:String(x.notes || ""),editId:null,busy:false}));
  }
  return drafts[sec.kind];
}
function persistDrafts(sec){
  const l = secDrafts(sec).filter(d => d.editId === null && (d.name || d.notes)).map(d => ({name:d.name,notes:d.notes}));
  lsSet(draftKey(sec), l.length ? JSON.stringify(l) : null);
}
const rowHTML = it => `<div class="row-item" data-id="${esc(it.id)}">
    <div class="main"><div class="nm">${esc(it.name)}</div>${it.notes ? `<div class="nt">${esc(it.notes)}</div>` : ""}</div>
    ${state.isOwner ? `<div class="acts"><button class="tinybtn r-edit" type="button" aria-label="ویرایش">${svgEdit}</button><button class="tinybtn danger r-del" type="button" aria-label="حذف">${svgTrash}</button></div>`
      : state.isAdmin ? `<div class="acts"><button class="tinybtn danger r-del" type="button" aria-label="حذف (مدیر)">${svgTrash}</button></div>` : ""}
  </div>`;
const formHTML = (sec,d) => `<div class="form" data-k="${d.k}">
    <input class="field f-name" maxlength="200" placeholder="${esc(sec.namePh)}" autocomplete="off" enterkeyhint="next">
    <textarea class="f-notes" placeholder="${esc(sec.notesPh)}"></textarea>
    <div class="bar"><button class="btn ghost xs f-cancel" type="button">انصراف</button><button class="btn xs f-save" type="button" disabled>ثبت</button></div>
  </div>`;

function renderSection(sec){
  const card = cardEl(sec.thread); if (!card) return;
  const items = itemsOf(sec.kind), dl = state.isOwner ? secDrafts(sec) : [];
  let html = "";
  for (const it of items){ const ed = dl.find(x => x.editId === it.id); html += ed ? formHTML(sec,ed) : rowHTML(it); }
  html += dl.filter(x => x.editId === null).map(d => formHTML(sec,d)).join("");
  $(".sec-list", card).innerHTML = html || `<div class="sec-empty">${state.isOwner ? "هنوز موردی ثبت نشده. با «افزودن» شروع کن." : "هنوز موردی ثبت نشده است."}</div>`;
  dl.forEach(d => {
    const el = $(`.form[data-k="${d.k}"]`, card); if (!el) return;
    $(".f-name", el).value = d.name;
    const ta = $(".f-notes", el); ta.value = d.notes; autoGrow(ta, 60);
    $(".f-save", el).disabled = !d.name.trim() || d.busy;
  });
  $(".sec-count", card).textContent = items.length ? `${fa(items.length)} مورد` : "";
  const addb = $(".add", card); if (addb) addb.hidden = dl.some(x => x.editId === null);   // the new-item form is open: no second + needed
}

function bindSection(sec, date){
  const card = cardEl(sec.thread);
  renderSection(sec);
  const add = $(".add", card);
  if (add) add.onclick = () => {
    const d = {k:++seq,name:"",notes:"",editId:null,busy:false};
    secDrafts(sec).push(d); renderSection(sec);
    const el = $(`.form[data-k="${d.k}"] .f-name`, card);
    if (el){ el.focus(); el.scrollIntoView({block:"center",behavior:"smooth"}); }
  };
  card.addEventListener("input", e => {
    const form = e.target.closest(".form"); if (!form) return;
    const d = secDrafts(sec).find(x => String(x.k) === form.dataset.k); if (!d) return;
    if (e.target.classList.contains("f-name")) d.name = e.target.value;
    else if (e.target.classList.contains("f-notes")){ d.notes = e.target.value; autoGrow(e.target, 60); }
    $(".f-save", form).disabled = !d.name.trim() || d.busy;
    if (d.editId === null) persistDrafts(sec);
  });
  card.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.classList.contains("f-name")){ e.preventDefault(); const n = $(".f-notes", e.target.closest(".form")); if (n) n.focus(); }
  });
  card.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    const form = b.closest(".form"), row = b.closest(".row-item"), dl = state.isOwner ? secDrafts(sec) : [];
    if (b.classList.contains("f-cancel") && form){
      const i = dl.findIndex(x => String(x.k) === form.dataset.k);
      if (i >= 0) dl.splice(i,1);
      persistDrafts(sec); renderSection(sec); return;
    }
    if (b.classList.contains("f-save") && form){
      const d = dl.find(x => String(x.k) === form.dataset.k); if (!d || !d.name.trim() || d.busy) return;
      d.busy = true; b.disabled = true; b.textContent = "در حال ثبت…";
      try {
        const it = await api.saveItem(date,{id:d.editId,kind:sec.kind,name:d.name.trim(),notes:d.notes.trim()});
        const en = state.entry;
        en.items = (en.items || []).filter(x => x.id !== it.id); en.items.push(it);
        en.items.sort((a,c) => String(a.created_at).localeCompare(String(c.created_at)));
        dl.splice(dl.indexOf(d),1); state.dates.add(date);
        let nd = null;
        if (d.editId === null){ nd = {k:++seq,name:"",notes:"",editId:null,busy:false}; dl.push(nd); }   // quick entry: a fresh empty form opens right away
        persistDrafts(sec);
        renderSection(sec); renderComments(sec.thread); updateSummary(); toast("ثبت شد");
        if (nd){ const el = $(`.form[data-k="${nd.k}"] .f-name`, card); if (el){ el.focus(); el.scrollIntoView({block:"center",behavior:"smooth"}); } }
      } catch (err) {
        d.busy = false;
        toast(err && err.message === "update needed" ? "ابتدا فایل SQL را در Supabase اجرا کن." : "ثبت نشد. اتصال را بررسی کن.");
        renderSection(sec);
      }
      return;
    }
    if (b.classList.contains("r-edit") && row){
      const it = itemsOf(sec.kind).find(x => x.id === row.dataset.id); if (!it) return;
      const d = {k:++seq,name:it.name,notes:it.notes || "",editId:it.id,busy:false};
      dl.push(d); renderSection(sec);
      const el = $(`.form[data-k="${d.k}"] .f-name`, card); if (el) el.focus();
      return;
    }
    if (b.classList.contains("r-del") && row){
      if (!confirm("این مورد حذف شود؟")) return;
      try {
        await api.deleteItem(row.dataset.id);
        state.entry.items = state.entry.items.filter(x => x.id !== row.dataset.id);
        renderSection(sec); renderComments(sec.thread); updateSummary(); toast("حذف شد");
      } catch { toast("حذف نشد."); }
    }
  });
}

/* ---- short feedback (under each question and each list) ---- */
function renderComments(t){
  const card = cardEl(t); if (!card) return;
  const list = (state.entry.comments || []).filter(c => c.q === t);
  const block = $(".comments", card), open = state.openT.has(t);
  block.hidden = !hasContent(t) && !list.length;
  block.classList.toggle("open", open); $(".cbody", card).hidden = !open; $(".ctoggle", card).setAttribute("aria-expanded", String(open));
  $(".ch", card).textContent = list.length ? `فیدبک (${fa(list.length)})` : "فیدبک";
  if ($(".ed", card)) return;                       // somebody is editing a feedback: do not redraw under their fingers
  $(".clist", card).innerHTML = list.map(c => {
    const m = memberOf(c.user_id) || {id:c.user_id,name:"؟"}, mine = c.user_id === state.me.id;
    return `<div class="comment" data-id="${esc(c.id)}">${avatar(m,"sm")}<div class="bubble">
      <div class="meta"><b>${esc(m.name)}</b><span>${esc(F.time.format(new Date(c.created_at)))}</span>
      ${mine || state.isAdmin ? `<span class="cact">${mine ? `<button class="edit" type="button">ویرایش</button>` : ""}<button class="del" type="button" data-id="${esc(c.id)}">حذف</button></span>` : ""}</div>
      <div class="txt">${esc(c.body)}</div></div></div>`;
  }).join("");
  $(".cform", card).hidden = !hasContent(t);   // feedback only makes sense under existing content
}

function bindComments(t, date){
  const card = cardEl(t), form = $(".cform", card), input = $(".field", form), btn = $(".send", form), cc = $(".ccount", card);
  $(".ctoggle", card).onclick = () => {
    if (state.openT.has(t)) state.openT.delete(t); else state.openT.add(t);
    renderComments(t);
    if (state.openT.has(t) && !form.hidden) setTimeout(() => input.focus({preventScroll:true}), 50);
  };
  input.addEventListener("input", () => {
    btn.disabled = !input.value.trim();
    cc.textContent = input.value.length ? `${fa(input.value.length)} / ${fa(MAX_COMMENT)}` : "";
  });
  form.onsubmit = async e => {
    e.preventDefault();
    const body = input.value.trim(); if (!body) return;
    btn.disabled = true;
    try {
      const c = await api.addComment(date,t,body,state.view.id);
      state.entry.comments.push(c); input.value = ""; cc.textContent = ""; renderComments(t);
    } catch { toast("ارسال نشد. دوباره تلاش کن."); btn.disabled = false; }
  };
  $(".clist", card).onclick = async e => {
    const row = e.target.closest(".comment"); if (!row) return;
    const id = row.dataset.id, c = state.entry.comments.find(x => String(x.id) === id);
    if (e.target.closest(".del")){
      if (!confirm("این فیدبک حذف شود؟")) return;
      try {
        await api.deleteComment(id);
        state.entry.comments = state.entry.comments.filter(x => String(x.id) !== id);
        renderComments(t);
      } catch { toast("حذف نشد."); }
      return;
    }
    if (e.target.closest(".edit") && c){
      $(".txt", row).innerHTML = `<div class="edrow"><input class="field ed" maxlength="${MAX_COMMENT}"><button class="btn xs ed-ok" type="button">ثبت</button><button class="btn xs ghost ed-no" type="button">انصراف</button></div>`;
      const inp = $(".ed", row); inp.value = c.body; inp.focus();
      return;
    }
    if (e.target.closest(".ed-no")){ renderCommentsForce(t); return; }
    if (e.target.closest(".ed-ok") && c){
      const v = $(".ed", row).value.trim(); if (!v) return;
      try { await api.editComment(id, v); c.body = v; renderCommentsForce(t); toast("ویرایش شد"); }
      catch { toast("ویرایش نشد."); }
    }
  };
}
function renderCommentsForce(t){ const card = cardEl(t); if (!card) return; const ed = $(".ed", card); if (ed) ed.classList.remove("ed"); renderComments(t); }

/* refresh feedback (and, on a colleague's page, their content) of the day being viewed */
async function refreshCurrent(){
  if (!state.me || !state.entry || state.page !== "day") return;
  const date = state.date;
  try {
    const fresh = await api.loadEntry(date, state.view.id);
    if (state.date !== date || state.page !== "day") return;
    const cur = state.entry;
    cur.comments = fresh.comments;
    if (!state.isOwner){ cur.answers = fresh.answers; cur.items = fresh.items; }
    state.qIds.forEach(id => { if (!state.isOwner) renderAnswerView(id); renderComments(id); });
    SECTIONS.forEach(sec => { if (!state.isOwner) renderSection(sec); renderComments(sec.thread); });
    updateSummary();
  } catch {}
  refreshFeedback();
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !state.me) return;
  if (LIVE && idleExpired()){ signOut(); return; }
  if (todayISO() !== renderedToday){ renderedToday = todayISO(); showRoute(); } else refreshCurrent();
});

/* ---- calendar (Persian), opened from the date at the top ---- */
const WD = ["ش","ی","د","س","چ","پ","ج"];   // the Persian week starts on Saturday
function openCalendar(){
  const sel = state.date, cur = jparts(parseISO(sel)), tp = jparts(new Date()), tIdx = tp.y*12 + tp.m;
  let vy = cur.y, vm = cur.m;
  const ov = document.createElement("div"); ov.className = "overlay";
  const sh = document.createElement("div"); sh.className = "sheet"; sh.setAttribute("role","dialog"); sh.setAttribute("aria-label","تقویم");
  document.body.append(ov, sh);
  requestAnimationFrame(() => { ov.classList.add("open"); sh.classList.add("open"); });
  let closed = false;
  const close = () => { closed = true; ov.classList.remove("open"); sh.classList.remove("open"); setTimeout(() => { ov.remove(); sh.remove(); }, 400); };
  ov.onclick = close;
  function draw(){
    const first = jmFirst(vy,vm), len = jmLen(vy,vm), off = (first.getDay() + 1) % 7, today = todayISO();
    let cells = "";
    for (let i = 0; i < off; i++) cells += "<span></span>";
    for (let d = 1; d <= len; d++){
      const g = new Date(first); g.setDate(first.getDate() + d - 1);
      const ds = iso(g), cls = ["cal-day"];
      if (ds === sel) cls.push("sel");
      if (ds === today) cls.push("today");
      cells += `<button type="button" class="${cls.join(" ")}" data-d="${ds}" ${ds > today ? "disabled" : ""}>${fy(d)}${state.dates.has(ds) ? `<i class="dot"></i>` : ""}</button>`;
    }
    sh.innerHTML = `<div class="grab"></div>
      <div class="cal-head">
        <button class="iconbtn" id="cpm" type="button" aria-label="ماه قبل">${svgPrev}</button>
        <div class="cal-title">${esc(F.month.format(first))} ${fy(vy)}</div>
        <button class="iconbtn" id="cnm" type="button" aria-label="ماه بعد" ${vy*12 + vm >= tIdx ? "disabled" : ""}>${svgNext}</button>
      </div>
      <div class="cal-grid">${WD.map(w => `<div class="cal-wd">${w}</div>`).join("")}${cells}</div>
      <div class="cal-foot"><button class="btn ghost" id="ctoday" type="button">امروز</button><button class="btn ghost" id="cclose" type="button">بستن</button></div>`;
    $("#cpm", sh).onclick = () => { if (vm === 1){ vm = 12; vy--; } else vm--; draw(); };
    $("#cnm", sh).onclick = () => { if (vm === 12){ vm = 1; vy++; } else vm++; draw(); };
    $("#cclose", sh).onclick = close;
    $("#ctoday", sh).onclick = () => { close(); go(todayISO()); };
    sh.querySelectorAll(".cal-day").forEach(b => b.onclick = () => { close(); go(b.dataset.d); });
  }
  draw();
  refreshDates().then(() => { if (!closed) draw(); });
}

/* ---- generic bottom sheet ---- */
function makeSheet(cls=""){
  const ov = document.createElement("div"); ov.className = "overlay";
  const sh = document.createElement("div"); sh.className = "sheet " + cls; sh.setAttribute("role","dialog");
  document.body.append(ov, sh);
  requestAnimationFrame(() => { ov.classList.add("open"); sh.classList.add("open"); });
  const close = () => { ov.classList.remove("open"); sh.classList.remove("open"); setTimeout(() => { ov.remove(); sh.remove(); }, 400); };
  ov.onclick = close;
  return {sh, close};
}

/* ---- feedback list (bell) ---- */
async function openFeedback(){
  const {sh, close} = makeSheet("tall");
  const seen0 = seenAt();
  sh.innerHTML = `<div class="grab"></div><h3>فیدبک‌ها</h3><div class="sub" id="fs"></div><div id="fl"></div>`;
  const curY = F.year.format(new Date());
  function draw(){
    const list = othersFb().slice().sort((a,b) => String(b.created_at).localeCompare(String(a.created_at))).slice(0,150);
    const n = list.filter(c => Date.parse(c.created_at) > seen0).length;
    $("#fs", sh).textContent = !list.length ? "" : n ? `${fa(n)} فیدبک جدید` : "همه خوانده شده‌اند";
    $("#fl", sh).innerHTML = list.map(c => {
      const m = memberOf(c.user_id) || {id:c.user_id,name:"؟"}, isNew = Date.parse(c.created_at) > seen0, d = new Date(c.created_at);
      const dl = dayMonth(c.date) + (F.year.format(parseISO(c.date)) !== curY ? " " + F.year.format(parseISO(c.date)) : "");
      return `<button class="nf" type="button" data-d="${c.date}" data-t="${c.q}">
        <div class="top"><i class="nd ${isNew ? "" : "off"}"></i>${avatar(m,"sm")}<span>${esc(m.name)}</span><small>${esc(dayMonth(iso(d)))} ${esc(F.time.format(d))}</small></div>
        <div class="wh">${esc(dl)} · ${esc(threadTitle(c.q))}</div>
        <div class="tx">${esc(c.body)}</div></button>`;
    }).join("") || `<div class="sub" style="padding:24px 4px">هنوز فیدبکی نیامده است.</div>`;
    const newest = list.reduce((mx,c) => Math.max(mx, Date.parse(c.created_at) || 0), 0);
    lsSet(seenKey(), String(Math.max(Date.now(), newest))); updateBadge();
  }
  draw();
  refreshFeedback().then(() => { if (sh.isConnected) draw(); });
  $("#fl", sh).onclick = e => { const b = e.target.closest(".nf"); if (!b) return; state.focusT = Number(b.dataset.t); close(); goTo(state.me.id, b.dataset.d); };
}

/* ---- search: names only (not the notes), every day, duplicates included ---- */
const DIG = {"۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9","٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9"};
const normKey = t => String(t || "").toLowerCase()
  .replace(/[۰-۹٠-٩]/g, c => DIG[c]).replace(/[يى]/g,"ی").replace(/[ك]/g,"ک").replace(/[ة]/g,"ه").replace(/[أإٱ]/g,"ا")
  .replace(/[ً-ٰٟـ]/g,"").replace(/[\s‌‍‏‎.\-_]+/g,"");
async function openSearch(){
  const {sh, close} = makeSheet("tall");
  sh.innerHTML = `<div class="grab"></div>
    <input class="field" id="sq" type="search" placeholder="${state.isOwner ? "جستجوی نام پزشک یا کاربر…" : "جستجو در گزارش‌های " + esc(state.view.name) + "…"}" autocomplete="off" enterkeyhint="search">
    <div class="chips"><button class="chip on" data-k="" type="button">همه</button>${SECTIONS.map(x => `<button class="chip" data-k="${x.kind}" type="button">${esc(x.title)}</button>`).join("")}</div>
    <div class="s-info" id="si"></div><div id="sres"></div>`;
  const q = $("#sq", sh), info = $("#si", sh), res = $("#sres", sh);
  const owner = state.view;
  let kind = "", all = state.allFor === owner.id ? state.all : null;
  const curY = F.year.format(new Date());
  const dlabel = d => `${dayMonth(d)}${F.year.format(parseISO(d)) !== curY ? " " + F.year.format(parseISO(d)) : ""}`;
  function draw(){
    if (!all){ info.textContent = "در حال خواندن…"; res.innerHTML = ""; return; }
    const key = normKey(q.value);
    if (!key){
      info.textContent = `در مجموع ${fa(all.length)} مورد ثبت شده. اسم را بنویس تا همه‌ی دفعات قبلی را ببینی.`; res.innerHTML = ""; return;
    }
    const list = all.filter(i => (!kind || i.kind === kind) && i._k.includes(key));
    if (!list.length){ info.textContent = "چیزی پیدا نشد."; res.innerHTML = ""; return; }
    const groups = new Map();
    list.sort((a,b) => (b.date + String(b.created_at)).localeCompare(a.date + String(a.created_at)));
    for (const i of list){ if (!groups.has(i._k)) groups.set(i._k, {name:i.name, items:[]}); groups.get(i._k).items.push(i); }
    info.textContent = `${fa(list.length)} مورد · ${fa(groups.size)} نام`;
    res.innerHTML = [...groups.values()].slice(0,100).map(g => `<div class="sg"><span>${esc(String(g.name).replace(/ي/g,"ی").replace(/ك/g,"ک"))}</span><small>${fa(g.items.length)} بار</small></div>` +
      g.items.map(i => `<button class="sr" type="button" data-d="${i.date}"><div class="d"><span>${esc(dlabel(i.date))}</span><span class="tag ${i.kind === "support" ? "sp" : ""}">${esc((SECTIONS.find(x => x.kind === i.kind) || {}).title || "")}</span></div>${i.notes ? `<div class="n">${esc(i.notes)}</div>` : ""}</button>`).join("")).join("");
  }
  q.addEventListener("input", draw);
  sh.querySelectorAll(".chip").forEach(c => c.onclick = () => { kind = c.dataset.k; sh.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c)); draw(); });
  res.onclick = e => { const b = e.target.closest(".sr"); if (!b) return; close(); goTo(owner.id, b.dataset.d); };
  draw();
  setTimeout(() => q.focus(), 350);
  try {
    const items = await api.searchItems(owner.id);
    items.forEach(i => { i._k = normKey(i.name); });
    state.all = all = items; state.allFor = owner.id; draw();
  } catch (e) { console.error(e); if (!all) info.textContent = "خواندن اطلاعات ممکن نشد. اتصال را بررسی کن."; }
}

/* ---- backup: a file with everything, saved on your phone / computer ---- */
function download(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function doBackup(fmt){
  try {
    toast("در حال آماده‌سازی…");
    const d = await api.exportAll(), t = todayISO();
    if (fmt === "json"){
      download(`team-journal-backup-${t}.json`, JSON.stringify({app:"team-journal",exported_at:new Date().toISOString(),...d}, null, 1), "application/json");
    } else {
      const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
      const jd = ds => { const j = jparts(parseISO(ds)); return `${j.y}/${pad(j.m)}/${pad(j.d)}`; };
      const rows = [["تاریخ شمسی","تاریخ میلادی","بخش","نام","توضیحات"]].concat(d.items.slice().sort((a,b) => String(a.date).localeCompare(String(b.date)))
        .map(i => [jd(i.date), i.date, (SECTIONS.find(x => x.kind === i.kind) || {}).title || i.kind, i.name, i.notes]));
      download(`team-journal-lists-${t}.csv`, "﻿" + rows.map(r => r.map(q).join(",")).join("\r\n"), "text/csv;charset=utf-8");
    }
    lsSet("tj-backup-last", String(Date.now())); renderNotice();
    toast("فایل دانلود شد");
  } catch (e) { console.error(e); toast("پشتیبان‌گیری نشد. اتصال را بررسی کن."); }
}

/* ---- member management (admin) ---- */
const memberErr = e => {
  const m = (e && e.message) || "";
  return /at least one active admin/i.test(m) ? "باید حداقل یک مدیر فعال بماند."
    : /no account/i.test(m) ? "حسابی با این ایمیل پیدا نشد. اول در Supabase بسازش."
    : /already a member/i.test(m) ? "این ایمیل از قبل عضو است."
    : /at most 10/i.test(m) ? "حداکثر ۱۰ عضو می‌شود."
    : /yourself/i.test(m) ? "این کار روی خودت ممکن نیست."
    : /admin only/i.test(m) ? "فقط مدیر می‌تواند." : "انجام نشد.";
};
async function openMembers(){
  const {sh, close} = makeSheet("tall");
  sh.innerHTML = `<div class="grab"></div><h3>مدیریت اعضا</h3>
    <div class="sub">فقط تو (مدیر) این بخش را می‌بینی. حساب جدید را اول در Supabase بساز، بعد اینجا اضافه‌اش کن.</div>
    <div id="ml">${loadingHTML()}</div>
    <div class="dvh">افزودن عضو</div>
    <div class="form">
      <input class="field ltr" id="ae" type="email" inputmode="email" placeholder="ایمیل حساب (ساخته‌شده در Supabase)" autocapitalize="off" autocorrect="off" spellcheck="false">
      <input class="field" id="an" maxlength="40" placeholder="نام نمایشی">
      <div class="seg" id="ar" role="group" aria-label="نقش"><button type="button" data-r="member" class="on">عضو</button><button type="button" data-r="admin">مدیر</button></div>
      <div class="bar"><button class="btn xs" id="aadd" type="button">افزودن</button></div>
    </div>
    <details class="help"><summary>چطور حساب جدید بسازم؟</summary>
      <ol><li>در Supabase: Authentication ← Users ← Add user ← Create new user.</li>
      <li>ایمیل و رمز را بنویس و «Auto Confirm User» را روشن کن.</li>
      <li>همان ایمیل را همین‌جا بنویس و «افزودن» را بزن.</li></ol>
      <div>«قطع دسترسی» موقت است و گزارش‌ها می‌مانند. «حذف» عضو را از تیم بیرون می‌برد.</div></details>
    <div class="row"><button class="btn block ghost" id="mc" type="button">بستن</button></div>`;
  $("#mc", sh).onclick = close;
  let role = "member";
  sh.querySelectorAll("#ar button").forEach(b => b.onclick = () => { role = b.dataset.r; sh.querySelectorAll("#ar button").forEach(x => x.classList.toggle("on", x === b)); });
  const box = $("#ml", sh);
  async function reload(){
    state.members = await api.members(); state.me = memberOf(state.user.id) || state.me;
    state.isAdmin = state.me.role === "admin";
  }
  async function draw(){
    let list;
    try { list = await api.listMembersAdmin(); }
    catch (e) { box.innerHTML = `<div class="sub">${/update 6|admin_list/i.test((e && e.message) || "") ? "دیتابیس هنوز به‌روز نشده (supabase-update-6.sql)." : "خواندن فهرست ممکن نشد."}</div>`; return; }
    box.innerHTML = list.map(m => {
      const me = m.user_id === state.user.id, mem = memberOf(m.user_id) || {id:m.user_id,name:m.display_name};
      return `<div class="dv" data-id="${esc(m.user_id)}"><div class="t">${avatar(mem,"sm")}<span>${esc(m.display_name)}</span>
        <span class="st ${m.role === "admin" ? "ok" : ""}">${esc(ROLE_FA[m.role] || m.role)}</span>
        ${m.active ? "" : `<span class="st wait">غیرفعال</span>`}${me ? `<span class="st">تو</span>` : ""}</div>
        <div class="m"><bdi dir="ltr">${esc(m.email || "")}</bdi></div>
        <div class="bar">
          <button class="btn xs ghost" data-a="rename" type="button">نام</button>
          <button class="btn xs ghost" data-a="role" data-r="${m.role === "admin" ? "member" : "admin"}" type="button">${m.role === "admin" ? "عضو کن" : "مدیر کن"}</button>
          ${me ? "" : `<button class="btn xs ghost" data-a="active" data-on="${m.active ? "0" : "1"}" type="button">${m.active ? "قطع دسترسی" : "وصل کن"}</button>
          <button class="btn xs danger" data-a="remove" type="button">حذف</button>`}
        </div></div>`;
    }).join("");
  }
  box.onclick = async e => {
    const b = e.target.closest("button[data-a]"), row = e.target.closest(".dv"); if (!b || !row) return;
    const id = row.dataset.id, a = b.dataset.a;
    try {
      if (a === "rename"){
        const cur = (memberOf(id) || {}).name || "", n = prompt("نام نمایشی:", cur);
        if (n === null || !n.trim()) return;
        await api.renameMember(id, n.trim());
      } else if (a === "role") await api.setRole(id, b.dataset.r);
      else if (a === "active") await api.setActive(id, b.dataset.on === "1");
      else if (a === "remove"){ if (!confirm("این عضو از تیم حذف شود؟ (گزارش‌هایش می‌ماند)")) return; await api.removeMember(id); }
      await reload(); await draw(); renderShell(); refreshFeedback(); showRoute(); toast("انجام شد");
    } catch (err) { toast(memberErr(err)); }
  };
  $("#aadd", sh).onclick = async () => {
    const em = $("#ae", sh).value.trim(), nm = $("#an", sh).value.trim();

    try {
      await api.addMember(em, nm, role);
      $("#ae", sh).value = ""; $("#an", sh).value = "";
      await reload(); await draw(); toast("اضافه شد");
    } catch (err) { toast(memberErr(err)); }
  };
  draw();
}

/* ---- settings sheet ---- */

  const live = api.mode === "live";
  sh.innerHTML = `<div class="grab"></div>
    <h3>${esc(state.me.name)}</h3>
    <div class="sub">${esc(ROLE_FA[state.me.role] || "")}${live && state.user.email ? " · " + esc(state.user.email) : ""}</div>
    <div class="seg" id="thm" role="group" aria-label="ظاهر">${[["system","سیستم"],["light","روشن"],["dark","تیره"]].map(([m,l]) => `<button type="button" data-m="${m}" class="${(lsGet(THEME_KEY) || "system") === m ? "on" : ""}">${l}</button>`).join("")}</div>
    ${state.isAdmin ? `<div class="row"><button class="btn block ghost" id="mm">مدیریت اعضا</button></div>` : ""}

    ${live ? `

  });
  const mm = $("#mm", sh); if (mm) mm.onclick = () => { close(); setTimeout(openMembers, 250); };
  if (live){
    if (state.isAdmin){
      $("#bkj", sh).onclick = () => doBackup("json");
      $("#bkc", sh).onclick = () => doBackup("csv");
    }
    $("#so2", sh).onclick = signOut;
    $("#cp", sh).onclick = async () => {

  } else {
    sh.querySelectorAll(".pick").forEach(b => b.onclick = () => {

/* ---- start ---- */
(async function boot(){
  try {
    api = LIVE ? await createLiveApi() : createDemoApi();
    let user = await api.getSession();
    if (user && LIVE && idleExpired()){ await api.signOut(); user = null; }
    if (!user) return loginView();
    touch();
    await enter(user);
  } catch (e) {
    console.error(e);
    errorView(LIVE ? "اتصال به Supabase برقرار نشد. آدرس و کلید را در فایل بررسی کنید." : "خطای غیرمنتظره.");
  }
})();
